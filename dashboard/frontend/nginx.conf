server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall through to index.html so client-side
    # routing works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API. The frontend calls /api/... and nginx forwards to the
    # API container, so the browser never makes a cross-origin request.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An engine run can take a while; do not cut it off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
