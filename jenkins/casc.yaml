# Jenkins Configuration as Code.
#
# Defines the security realm and the ThreatWeave pipeline job so a fresh
# container comes up ready to run - no setup wizard, no manual job creation.
jenkins:
  systemMessage: "ThreatWeave - AIOps security pipeline"
  numExecutors: 2
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: |
      pipelineJob('threatweave-pipeline') {
        description('''DevSecOps pipeline: scans the configured project with SonarQube,
                       GitLeaks, Trivy and Checkov, then runs the AIOps engine
                       to deduplicate, score and correlate the findings.''')
        parameters {
          // Defaults come from the environment (SCAN_* in .env or `-e` on
          // docker run) and are empty otherwise: a fresh install scans
          // nothing it was not told to. An empty value skips that scanner.
          stringParam('TARGET_IMAGE', '${SCAN_IMAGE:-}',
                      'Container image to scan with Trivy. Empty skips Trivy.')
          stringParam('SOURCE_DIR', '${SCAN_SOURCE_DIR:-}',
                      '''Source tree to scan with GitLeaks and SonarQube, e.g. /target.
                         Paths under /target resolve to TARGET_PATH on the host.
                         Empty skips both, and automatic runs stay idle.''')
          stringParam('IAC_DIR', '${SCAN_IAC_DIR:-}',
                      '''Infrastructure-as-code directory for Checkov, e.g.
                         /target/infra. Empty skips Checkov.''')
          stringParam('SONAR_PROJECT_KEY', '${SCAN_SONAR_KEY:-}',
                      'SonarQube project key. Empty derives one from the source folder name.')
          booleanParam('RUN_AWS_MONITOR', true,
                       'Include live AWS cloud governance checks')
          booleanParam('FAIL_ON_CRITICAL', false,
                       'Fail the build when the health score is critical')
        }
        definition {
          cps {
            // readFileFromWorkspace cannot be used here: CasC runs job scripts
            // during startup, before any workspace exists. The Jenkinsfile is
            // mounted into JENKINS_HOME by compose and read directly instead.
            script(new File('/var/jenkins_home/Jenkinsfile').text)
            sandbox(false)
          }
        }
      }
