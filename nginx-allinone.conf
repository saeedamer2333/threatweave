server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall through to index.html so client-side
    # routing works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API runs in the same container (see supervisord.conf), so this is
    # always localhost - none of the split image's cross-container DNS
    # resolution concerns apply here.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An engine run can take a while; do not cut it off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Jenkins is not proxied through here - it is not configured to run
    # under a URL prefix (its internal links and CasC config assume root),
    # and prefix-proxying a stock Jenkins reliably is its own can of worms.
    # It has its own port (8080) published directly instead.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
