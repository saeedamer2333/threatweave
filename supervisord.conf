; Runs the three ThreatWeave processes inside one container.
;
; Jenkins keeps its own base-image startup script (tini + jenkins.sh) so
; plugin/CasC bootstrap behaves exactly as it does in the split jenkins
; image. nginx and the API are simple foreground commands.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; Jenkins needs to reach the mounted /var/run/docker.sock to launch scanner
; sibling containers. The natural fix - grant the jenkins user group access
; via `docker run --group-add 0` - does NOT work here: supervisord's own
; `user=` directive calls setgroups([]) before switching uid/gid (a
; documented supervisord security behaviour, not a bug), which unconditionally
; strips every supplementary group the container itself was given, so the
; group grant never reaches the jenkins process no matter what's passed at
; `docker run` time. Confirmed live: `docker exec -u jenkins ... id` showed
; the extra group; the *actual* running Jenkins process's own
; /proc/PID/status showed only its primary group, nothing else.
; Fixed by chmod'ing the socket to be world-writable as root, once, before
; handing off to the jenkins user via `su` (whose own group-list rebuild
; from /etc/group no longer matters, since the socket no longer requires
; group membership at all) - this sidesteps the whole supplementary-group
; question rather than fighting supervisord's own hardening.
; Jenkins waits on sonarqube-autoconfig's marker file before it ever starts,
; so SAST is either fully configured (SONAR_HOST_URL/SONAR_TOKEN sourced
; from it) or definitively off (an empty marker, written immediately when
; SONARQUBE_AUTOSTART=false) before the pipeline job could possibly run -
; never a race where a build starts against a SonarQube that isn't ready yet.
[program:jenkins]
; A real script file, not an inline `sh -c "...; ...; ..."` string - see
; jenkins-entrypoint.sh's own header comment for why: supervisord's command
; parsing silently failed to carry SONAR_HOST_URL/SONAR_TOKEN through to
; the real Jenkins process once the inline command grew past a couple of
; simple steps, confirmed by inspecting the actual running process's own
; /proc/PID/environ - the exact same sequence worked fine run by hand.
command=/usr/local/bin/jenkins-entrypoint.sh
user=root
directory=/var/jenkins_home
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; SonarQube itself - included by default (SONARQUBE_AUTOSTART=true, baked in
; as the image's own default). Set SONARQUBE_AUTOSTART=false at `docker run`
; time to skip it entirely, e.g. on a host that can't spare the extra RAM.
[program:sonarqube]
command=/opt/sonarqube/docker/entrypoint.sh
user=sonarqube
directory=/opt/sonarqube
; SonarQube needs a newer JRE than Jenkins' own bundled one - see the
; Dockerfile comment by the /opt/java-sonar COPY. Only this program gets
; the override; Jenkins keeps using its own JDK 17 unaffected.
environment=JAVA_HOME="/opt/java-sonar",PATH="/opt/java-sonar/bin:%(ENV_PATH)s"
autostart=%(ENV_SONARQUBE_AUTOSTART)s
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Waits for SonarQube, replaces its default password, generates a token, and
; writes it to the marker file jenkins waits on above - see
; sonarqube-autoconfig.sh for the full sequence. Always starts (even when
; SonarQube itself is disabled) so it can write the empty marker that
; unblocks jenkins in that case too.
[program:sonarqube-autoconfig]
command=/usr/local/bin/sonarqube-autoconfig.sh
user=root
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=node /app/dist/main.js
user=root
directory=/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
