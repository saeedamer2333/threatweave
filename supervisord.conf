; Runs the three ThreatWeave processes inside one container.
;
; Jenkins keeps its own base-image startup script (tini + jenkins.sh) so
; plugin/CasC bootstrap behaves exactly as it does in the split jenkins
; image. nginx and the API are simple foreground commands.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:jenkins]
command=/usr/local/bin/jenkins.sh
user=jenkins
directory=/var/jenkins_home
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=node /app/dist/main.js
user=root
directory=/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
